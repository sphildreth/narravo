name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narravo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      CI: 'true'
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/narravo_test
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAILS: admin@example.com
      ANALYTICS_IP_SALT: ci-analytics-salt
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm drizzle:migrate

      - name: Cache Next.js build data
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Initialize build cache on a cold runner
        run: mkdir -p .next/cache

      - name: Run quality checks
        run: python3 scripts/do-prechecks.py --database
