# Performance Monitoring CI
name: Performance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  performance-check:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/narravo_test
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAILS: admin@example.com
      ANALYTICS_IP_SALT: ci-analytics-salt
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: narravo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '22'
    
    - name: Enable Corepack (pnpm)    
      run: corepack enable

    - name: Show tool versions
      run: |
        node --version
        pnpm --version
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Setup database
      run: |
        pnpm drizzle:migrate
        pnpm seed:config
    
    - name: Seed performance post
      run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/perf/fixture.sql

    - name: Build production application
      run: pnpm build

    - name: Start application
      run: |
        pnpm start > "$RUNNER_TEMP/narravo.log" 2>&1 &
        curl --retry 30 --retry-delay 1 --retry-connrefused -fsS http://localhost:3000/healthz
        curl -fsS http://localhost:3000/sample-post > /dev/null

    - name: Check post JavaScript budget
      run: node scripts/perf/post-bundle.mjs

    - name: Run Lighthouse and enforce performance budgets
      run: pnpm perf:lighthouse

    - name: Run load benchmark
      run: pnpm perf:loadtest --duration 15 --overallRate 10

    - name: Upload performance artifacts
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: performance-reports
        path: |
          lighthouse-results/
          .lighthouseci/
        retention-days: 30
        if-no-files-found: ignore
