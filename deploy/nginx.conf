server {
  listen 80;
  server_name your-domain.com;
  # Enforced before Next.js parses multipart bodies. This leaves room for a
  # 100 MiB restore archive plus multipart framing.
  client_max_body_size 101m;
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This example is the public trust boundary; overwrite rather than append
    # a caller-supplied forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
