services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: narravo-web:prod
    env_file:
      - deploy/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in deploy/.env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in deploy/.env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY must be set in deploy/.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist uploaded files outside the container
      - narravo_uploads:/app/public/uploads
    restart: unless-stopped
    networks:
      - frontend
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    volumes:
      - narravo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

networks:
  frontend:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  narravo_pg_data:
  narravo_uploads:
