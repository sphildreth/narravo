packages:
  - "."

allowBuilds:
  esbuild: false
  puppeteer: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 0

ignoredBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    # @auth/core/next-auth still declare @simplewebauthn ^9 peers; the app uses
    # its own 2FA implementation, so track the version actually installed here.
    "@simplewebauthn/browser": ">=14"
    "@simplewebauthn/server": ">=14"
    # eslint-config-next still pulls eslint-plugin-react / eslint-plugin-jsx-a11y,
    # whose peer ranges stop at ESLint ^9 (ESLint 10 removed context.getFilename),
    # so the linter stays on the 9.x line until those plugins catch up.
    eslint: ">=9 <10"

overrides:
  esbuild: ">=0.25.0"
  postcss: "8.5.28"
  # qs < 6.16.0 is reachable only through @lhci/cli > express (dev-only), but the
  # DoS/prototype advisories still fail `pnpm audit`; pin the patched line.
  qs: ">=6.16.0"
  # lodash-es <=4.17.23 is vulnerable to prototype pollution (GHSA-f23m-r3pf-42rh).
  # It arrives through mermaid > chevrotain, which allows ^4.17.21, so this stays
  # inside the declared range and dedupes with dagre-d3-es' copy.
  lodash-es: ">=4.17.24"
  prismjs: ">=1.30.0"
  tmp: ">=0.2.4"
  vite: "$vite"
  lighthouse: "13.4.1"
  "@puppeteer/browsers": ">=3.0.0"
  proxy-agent: ">=8.0.2"
  uuid: "11.1.1"
  yaml: "2.9.0"
