packages:
  - "."

allowBuilds:
  esbuild: false
  puppeteer: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 0

ignoredBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    # @auth/core/next-auth still declare @simplewebauthn ^9 peers; the app uses
    # its own 2FA implementation, so track the version actually installed here.
    "@simplewebauthn/browser": ">=14"
    "@simplewebauthn/server": ">=14"
    # eslint-plugin-react / eslint-plugin-jsx-a11y still declare peer ranges that
    # stop at ESLint ^9, while the linter runs on the 10.x line (verified working
    # with eslint-config-next >= 16.4.3). Allow the out-of-range declaration.
    eslint: ">=9"

overrides:
  esbuild: ">=0.25.0"
  postcss: "8.5.28"
  # qs < 6.16.0 is reachable only through @lhci/cli > express (dev-only), but the
  # DoS/prototype advisories still fail `pnpm audit`; pin the patched line.
  qs: ">=6.16.0"
  # lodash-es <=4.17.23 is vulnerable to prototype pollution (GHSA-f23m-r3pf-42rh).
  # It arrives through mermaid > chevrotain, which allows ^4.17.21, so this stays
  # inside the declared range and dedupes with dagre-d3-es' copy.
  lodash-es: ">=4.17.24"
  prismjs: ">=1.30.0"
  tmp: ">=0.2.4"
  # basic-ftp <=6.2.0 is vulnerable to CPU DoS in Client.list() (GHSA-c475-qrg2-pj4r).
  # Dev-only: arrives through @lhci/cli > lighthouse > puppeteer-core > proxy-agent
  # > get-uri (which declares ^5.3.1), and the FTP code paths are never exercised.
  basic-ftp: ">=6.2.1"
  vite: "$vite"
  lighthouse: "13.4.1"
  "@puppeteer/browsers": ">=3.0.0"
  proxy-agent: ">=8.0.2"
  uuid: "11.1.1"
  yaml: "2.9.0"
